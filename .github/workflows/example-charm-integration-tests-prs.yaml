name: Selected Example Charm Integration Tests

on:
  pull_request:
    paths:
      - examples/**

permissions: {}

jobs:
  test-charm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: examples/machine-tinyproxy
            profile: machine
          - dir: examples/k8s-1-minimal
            profile: k8s
          - dir: examples/k8s-2-configurable
            profile: k8s
          - dir: examples/k8s-3-postgresql
            profile: k8s
          - dir: examples/k8s-4-action
            profile: k8s
          - dir: examples/k8s-5-observe
            profile: k8s
          - dir: examples/httpbin-demo
            profile: k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # Need full history to diff against the base branch.
      - id: select
        name: Check whether this charm has changed
        run: |
          # GITHUB_BASE_REF is a default env var set by GitHub Actions.
          base="origin/$GITHUB_BASE_REF"
          if git diff --name-only "$base...HEAD" -- "${{ matrix.dir }}/" | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up uv
        if: ${{ steps.select.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Install tox, tox-uv, and Concierge
        if: ${{ steps.select.outputs.run == 'true' }}
        run: |
          uv tool install tox --with tox-uv
          sudo snap install --classic concierge
      - name: Prepare for deploying charms
        if: ${{ steps.select.outputs.run == 'true' }}
        run: sudo concierge prepare -p ${{ matrix.profile }}
        timeout-minutes: 90  # Abandon the job if the GHA runner gets stuck.
      - name: Fetch libs and pack the charm
        if: ${{ steps.select.outputs.run == 'true' }}
        working-directory: ${{ matrix.dir }}
        run: |
          if grep -Eq "^charm-libs:" charmcraft.yaml; then
            charmcraft fetch-libs
          fi
          charmcraft pack
      - name: Run integration tests
        if: ${{ steps.select.outputs.run == 'true' }}
        working-directory: ${{ matrix.dir }}
        run: tox -e integration
