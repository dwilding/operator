name: Example Charm Integration Tests

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '50 15 * * 2'  # 15:50 UTC Tuesdays

permissions: {}

jobs:
  # Pack & run integration tests for K8s charms.
  k8s-examples-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - examples/k8s-3-postgresql
          - examples/k8s-4-action
          - examples/k8s-5-observe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Set up tox and tox-uv
        run: uv tool install tox --with tox-uv
      - name: Install Concierge
        run: sudo snap install --classic concierge
      - name: Prepare for deploying K8s charms
        run: sudo concierge prepare -p k8s
        timeout-minutes: 90  # Abandon the job if the GHA runner gets stuck.
      - name: Warm containerd with the postgres image
        if: matrix.dir == 'examples/k8s-3-postgresql'
        run: |
          # Query Charmhub for the postgresql-k8s OCI image resource, then pull
          # it into the k8s snap's containerd store so the pod skips the slow
          # registry pull at deploy time.
          info=$(curl -fsSL 'https://api.charmhub.io/v2/charms/info/postgresql-k8s?channel=14/stable&fields=default-release.resources,default-release.revision')
          charm_id=$(echo "$info" | jq -r '.id')
          resource=$(echo "$info" | jq -c '.["default-release"].resources[] | select(.type == "oci-image")')
          resource_name=$(echo "$resource" | jq -r '.name')
          revision=$(echo "$resource" | jq -r '.revision')
          manifest=$(curl -fsSL "https://api.charmhub.io/api/v1/resources/download/charm_${charm_id}.${resource_name}_${revision}")
          image=$(echo "$manifest" | jq -r '.ImageName')
          username=$(echo "$manifest" | jq -r '.Username')
          password=$(echo "$manifest" | jq -r '.Password')
          auth_file=$(mktemp)
          printf '{"auths": {"https://index.docker.io/v1/": {"auth": "%s"}}}' \
            "$(printf '%s:%s' "$username" "$password" | base64 -w0)" > "$auth_file"
          /snap/k8s/current/bin/ctr -n k8s.io image pull --auth-file "$auth_file" "$image"
          rm -f "$auth_file"
      - name: Fetch any charmlibs
        run: |
          cd ${{ matrix.dir }}
          if grep -Eq "^charm-libs:" charmcraft.yaml; then
            charmcraft fetch-libs
          fi
      - name: Pack charm
        run: |
          cd ${{ matrix.dir }}
          charmcraft pack
      - name: Run integration tests
        run: |
          cd ${{ matrix.dir }}
          tox -e integration
